name: drive-fetch
# Fetches a Drive file using the runner's full internet (sandbox cannot reach Drive)
# Trigger: push this file to arena/** OR manual dispatch
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/drive-fetch.yml']
  workflow_dispatch:
    inputs:
      file_id:
        description: 'Drive file ID'
        required: false
        default: '1CRbT9I3GDl2itg2P8XGaiFhJARWAgCA5'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          pip install gdown -q
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip file > /dev/null

      - name: Try to download Drive file (3 methods)
        id: dl
        env:
          FILE_ID: ${{ inputs.file_id || '1CRbT9I3GDl2itg2P8XGaiFhJARWAgCA5' }}
        run: |
          set -x
          echo "File ID: $FILE_ID"
          echo "Method 1: gdown"
          gdown --id "$FILE_ID" -O /tmp/drive_file.zip || true
          ls -lh /tmp/drive_file.zip || echo "gdown failed"
          
          if [ ! -s /tmp/drive_file.zip ] || [ $(stat -c%s /tmp/drive_file.zip 2>/dev/null || echo 0) -lt 1000 ]; then
            echo "Method 2: drive.usercontent.google.com"
            curl -L -v "https://drive.usercontent.google.com/download?id=$FILE_ID&export=download" -o /tmp/drive_file2.zip 2>&1 | tail -30
            ls -lh /tmp/drive_file2.zip || true
            if [ -s /tmp/drive_file2.zip ]; then
              # check if it's actually html warning page
              if file /tmp/drive_file2.zip | grep -i html; then
                echo "Got HTML, trying to extract confirmation token"
                cat /tmp/drive_file2.zip | head -100
              else
                cp /tmp/drive_file2.zip /tmp/drive_file.zip
              fi
            fi
          fi
          
          if [ ! -s /tmp/drive_file.zip ] || [ $(stat -c%s /tmp/drive_file.zip 2>/dev/null || echo 0) -lt 1000 ]; then
            echo "Method 3: drive.google.com/uc"
            curl -L -v "https://drive.google.com/uc?export=download&id=$FILE_ID" -o /tmp/drive_file3.zip 2>&1 | tail -30
            ls -lh /tmp/drive_file3.zip || true
          fi
          
          # Pick the largest file
          ls -lh /tmp/drive_file*.zip || true
          BEST=$(ls -S /tmp/drive_file*.zip 2>/dev/null | head -1 || echo "")
          if [ -n "$BEST" ]; then
            echo "Best file: $BEST $(stat -c%s $BEST) bytes"
            file "$BEST"
            mkdir -p /tmp/drive_extract
            unzip -l "$BEST" 2>&1 | head -200 || true
            # Save manifest
            unzip -l "$BEST" 2>&1 > /tmp/MANIFEST.txt || echo "not a zip" > /tmp/MANIFEST.txt
            cat /tmp/MANIFEST.txt | head -100
            # Copy to workspace for commit if it's valid
            if file "$BEST" | grep -qi zip; then
              cp "$BEST" ./drive_download.zip
              cp /tmp/MANIFEST.txt ./DRIVE_MANIFEST.txt
              echo "success=true" >> $GITHUB_OUTPUT
            else
              echo "File is not zip, content:"
              head -50 "$BEST"
              echo "success=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No file downloaded"
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-fetch-result
          path: |
            /tmp/drive_file*.zip
            /tmp/MANIFEST.txt
            /tmp/*.html
          if-no-files-found: warn

      - name: Commit manifest if success (for audit)
        if: steps.dl.outputs.success == 'true'
        run: |
          git config user.name 'drive-fetcher[bot]'
          git config user.email 'drive-fetcher@users.noreply.github.com'
          git add drive_download.zip DRIVE_MANIFEST.txt 2>/dev/null || true
          git commit -m "drive-fetch: downloaded $FILE_ID [relay]" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }} || true
