name: drive-fetch
on:
  workflow_dispatch:
    inputs:
      file_id:
        description: 'Drive file ID'
        required: false
        default: '1CRbT9I3GDl2itg2P8XGaiFhJARWAgCA5'
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/drive-fetch.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          pip install gdown -q
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip file curl > /dev/null 2>&1 || true

      - name: Try download
        run: |
          set -x
          FILE_ID="${{ inputs.file_id || '1CRbT9I3GDl2itg2P8XGaiFhJARWAgCA5' }}"
          echo "FILE_ID=$FILE_ID" | tee FETCH_LOG.txt
          echo "=== gdown ===" | tee -a FETCH_LOG.txt
          gdown --id "$FILE_ID" -O /tmp/gdown.zip 2>&1 | tee -a FETCH_LOG.txt || true
          ls -lh /tmp/gdown.zip 2>&1 | tee -a FETCH_LOG.txt || true
          file /tmp/gdown.zip 2>&1 | tee -a FETCH_LOG.txt || true
          echo "=== curl usercontent ===" | tee -a FETCH_LOG.txt
          curl -L -v "https://drive.usercontent.google.com/download?id=$FILE_ID&export=download" -o /tmp/curl1.zip 2>&1 | tail -20 | tee -a FETCH_LOG.txt
          ls -lh /tmp/curl1.zip 2>&1 | tee -a FETCH_LOG.txt || true
          file /tmp/curl1.zip 2>&1 | tee -a FETCH_LOG.txt || true
          echo "=== curl uc ===" | tee -a FETCH_LOG.txt
          curl -L -v "https://drive.google.com/uc?export=download&id=$FILE_ID" -o /tmp/curl2.zip 2>&1 | tail -20 | tee -a FETCH_LOG.txt
          ls -lh /tmp/curl2.zip 2>&1 | tee -a FETCH_LOG.txt || true
          file /tmp/curl2.zip 2>&1 | tee -a FETCH_LOG.txt || true
          ls -lh /tmp/*.zip 2>&1 | tee -a FETCH_LOG.txt
          for f in /tmp/*.zip; do echo "--- $f head ---"; head -c 2000 "$f" | strings | head -20; done | tee -a FETCH_LOG.txt
          for f in /tmp/*.zip; do if file "$f" | grep -qi zip; then unzip -l "$f" | head -50 | tee -a FETCH_LOG.txt; fi; done
          cp FETCH_LOG.txt DRIVE_FETCH_LOG.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: drive-fetch-log
          path: |
            FETCH_LOG.txt
            DRIVE_FETCH_LOG.md
            /tmp/*.zip
          if-no-files-found: warn
